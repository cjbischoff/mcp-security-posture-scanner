[project]
name = "mcp-scanner-oncall"
version = "0.1.0"
description = "MCP Security Posture Scanner — on-call responder agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Upstream starlette notice about its own TestClient transport; not our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
