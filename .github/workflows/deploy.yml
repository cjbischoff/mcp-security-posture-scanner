name: Deploy

# Deploys on merge to main, only after CI passes.
# Requires the DEPLOY_HOOK_URL secret (e.g. a Render/Fly deploy hook) to be
# configured on an APPROVED hosting target. Until it is set, the job is a
# documented no-op — see README "Deployment" for the policy note.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL secret not configured — skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
